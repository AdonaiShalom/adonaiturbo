<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adonai Turbo</title>
<style>
  :root {
    --bg:#F5EEDB; --panel:#FFFCF4; --panel-2:#EFE5CC; --line:#DCCFAE;
    --text:#15224A; --head:#0C1A45; --muted:#586386;
    --acento:#D9A63E; --acento-soft:rgba(217,166,62,.2); --acento-txt:#8A5E08; --on-acento:#1A1300;
    --azul:#3A62C8; --azul-soft:rgba(58,98,200,.14); --ok:#2F7D5B; --perigo:#B23A2B; --aviso:#A8740A;
    --serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0A1330; --panel:#101C3D; --panel-2:#172852; --line:#263865;
      --text:#E4E9F6; --head:#F4EBD6; --muted:#9AA7C7;
      --acento:#E3B04B; --acento-soft:rgba(227,176,75,.16); --acento-txt:#E3B04B; --on-acento:#1A1300;
      --azul:#8FB4FF; --azul-soft:rgba(143,180,255,.16); --ok:#5DCAA5; --perigo:#F09A8C; --aviso:#E8C36A;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0A1330; --panel:#101C3D; --panel-2:#172852; --line:#263865;
    --text:#E4E9F6; --head:#F4EBD6; --muted:#9AA7C7;
    --acento:#E3B04B; --acento-soft:rgba(227,176,75,.16); --acento-txt:#E3B04B; --on-acento:#1A1300;
    --azul:#8FB4FF; --azul-soft:rgba(143,180,255,.16); --ok:#5DCAA5; --perigo:#F09A8C; --aviso:#E8C36A;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--acento);outline-offset:2px}
  h1,h2,h3,p{margin:0}
  .app{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);height:100%}

  .aviso{grid-column:1/-1;background:var(--acento-soft);color:var(--text);font-size:13px;padding:6px 16px;border-bottom:1px solid var(--line)}
  .top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .proj{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid var(--line);border-radius:12px;padding:6px 12px 6px 8px;text-align:left}
  .proj img{width:34px;height:34px;flex:none}
  .proj b{display:block;font-family:var(--serif);font-size:15px;color:var(--head);line-height:1.2}
  .proj small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
  .proj[aria-pressed="true"]{border-color:var(--acento);background:var(--acento-soft)}
  .espaco{flex:1}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 9px;font-size:12.5px;color:var(--muted)}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .btn{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px}
  .btn:hover{border-color:var(--acento)}
  .btn.pri{background:var(--acento);color:var(--on-acento);border-color:var(--acento);font-weight:600}
  .btn.sm{padding:3px 9px;font-size:12px;border-radius:8px}

  .side{background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
  .nav{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;border-radius:9px;padding:8px 10px;text-align:left;color:var(--muted);font-size:14px}
  .nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .nav:hover{background:var(--panel-2);color:var(--text)}
  .nav[aria-current="page"]{background:var(--acento-soft);color:var(--head);font-weight:600}
  .nav[aria-current="page"] svg{stroke:var(--acento-txt)}
  .nav .n{margin-left:auto;font-size:11.5px;background:var(--acento);color:var(--on-acento);border-radius:999px;padding:0 7px;font-weight:600}
  .nav .em{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}

  .main{overflow:auto;padding:18px 22px 28px}
  .cab{margin-bottom:14px}
  .cab h1{font-family:var(--serif);font-size:24px;color:var(--head);font-weight:600}
  .cab p{color:var(--muted);font-size:14px}
  .strip{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:14px;overflow:hidden}
  .strip div{flex:1;min-width:130px;padding:10px 16px;border-right:1px solid var(--line)}
  .strip div:last-child{border-right:0}
  .strip small{display:block;color:var(--muted);font-size:12px}
  .strip b{font-family:var(--serif);font-size:22px;color:var(--head);font-weight:600}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .card h2{font-family:var(--serif);font-size:17px;color:var(--head);font-weight:600;margin-bottom:8px}
  .card .sub{color:var(--muted);font-size:13px;margin-bottom:8px}
  .teiaC{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;margin-bottom:14px}
  .teiaBox{min-width:0;overflow:auto;text-align:center}
  #teia svg{width:100%;max-width:780px;height:auto;display:inline-block}
  .lado{display:flex;flex-direction:column;gap:12px}
  .tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .leg{display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
  .leg span{display:flex;align-items:center;gap:7px}
  .leg i{width:11px;height:11px;border-radius:50%;display:inline-block;border:2px solid var(--muted)}
  .leg .g{background:var(--acento);border-color:var(--acento)}
  .leg .f{border-color:var(--azul)}
  .leg .e{background:var(--azul);border-color:var(--azul)}
  .leg .o{border-color:var(--muted)}
  .leg .p{opacity:.4}

  .feed{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:260px;overflow:auto;font-size:13px}
  .feed li{display:grid;grid-template-columns:58px 1fr;gap:8px}
  .feed time{color:var(--muted);font-variant-numeric:tabular-nums}
  .feed b{color:var(--head)}
  .pill{display:inline-block;font-size:11.5px;padding:0 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .pill.g{color:var(--acento-txt);border-color:var(--acento)}
  .pill.q{color:var(--azul);border-color:var(--azul)}
  .fila{display:flex;flex-wrap:wrap;gap:6px}
  .mut{color:var(--muted);font-size:13px}
  .ap{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--bg)}
  .ap p{font-size:13.5px;color:var(--head)}
  .ap small{color:var(--muted);font-size:12px}
  .ap .ac{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .ap textarea{width:100%;margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:60px;resize:vertical}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:12.5px}
  tr.cam td{background:var(--panel-2);color:var(--head);font-family:var(--serif);font-weight:600}
  tbody tr[data-ag]{cursor:pointer}
  tbody tr[data-ag]:hover td{background:var(--acento-soft)}
  tr.sel td{background:var(--acento-soft)}
  .est{display:inline-flex;align-items:center;gap:6px}
  .est i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--muted)}
  .est.gerando i{background:var(--acento)}
  .est.fila i,.est.espera i{background:var(--azul)}
  .est.pausado i{background:transparent;border:2px solid var(--muted)}
  .split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
  .det h3{font-family:var(--serif);font-size:18px;color:var(--head);margin-bottom:2px}
  .det dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0;font-size:13px}
  .det dt{color:var(--muted)}
  .det dd{margin:0;color:var(--head)}
  .det .ac{display:flex;gap:6px;flex-wrap:wrap}

  .kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .kb h3{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
  .tk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13.5px}
  .tk .ag{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px}
  .frm{display:flex;gap:8px;margin-bottom:12px}
  .frm input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px}

  .grp{margin-bottom:16px}
  .grp h2{font-family:var(--serif);font-size:18px;color:var(--head);margin-bottom:8px}
  .cx{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .cx .card{padding:11px 13px}
  .cx h3{font-size:14.5px;color:var(--head);display:flex;justify-content:space-between;gap:8px;align-items:center}
  .cx p{font-size:13px;color:var(--muted);margin-top:4px}
  .tag{font-size:11.5px;border-radius:999px;padding:0 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .tag.ativo{color:var(--ok);border-color:var(--ok)}
  .tag.sug{color:var(--acento-txt);border-color:var(--acento)}
  .tag.plan{color:var(--muted)}

  .heat{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:2px;font-size:11px;color:var(--muted)}
  .heat .c{aspect-ratio:1/1;border-radius:3px;background:var(--panel-2)}
  .heat .c.l1{background:var(--acento-soft)}
  .heat .c.l2{background:color-mix(in srgb,var(--acento) 45%,transparent)}
  .heat .c.l3{background:color-mix(in srgb,var(--acento) 75%,transparent)}
  .heat .c.l4{background:var(--acento)}
  .heat .c.hoje{outline:2px solid var(--azul);outline-offset:1px}
  .heat .h{text-align:center}
  .semaf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .semaf h3{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:16px;color:var(--head);margin-bottom:6px}
  .semaf h3 i{width:12px;height:12px;border-radius:50%;display:inline-block}
  .semaf ul{margin:0;padding-left:18px;font-size:13.5px}
  .semaf li{margin:3px 0}
  .lista{margin:0;padding-left:18px;font-size:14px}
  .lista li{margin:4px 0}

  #teia .an{fill:none;stroke:var(--line);stroke-width:1}
  #teia .ra{stroke:var(--line);stroke-width:1;opacity:.4}
  #teia .ed{stroke:var(--line);stroke-width:1.3;fill:none}
  #teia .ed.sv{stroke-dasharray:4 4}
  #teia .ed.on{stroke:var(--acento);stroke-width:2.4}
  #teia .nd{cursor:pointer}
  #teia .nd circle.b{fill:var(--panel);stroke:var(--muted);stroke-width:2}
  #teia .nd text{fill:var(--head);font-size:13px;font-family:var(--sans);text-anchor:middle}
  #teia .nd text.ini{font-size:12px;font-weight:600;fill:var(--muted)}
  #teia .nd.gerando circle.b{stroke:var(--acento);fill:var(--acento-soft)}
  #teia .nd.gerando text.ini{fill:var(--acento-txt)}
  #teia .nd.fila circle.b{stroke:var(--azul)}
  #teia .nd.espera circle.b{stroke:var(--azul);fill:var(--azul-soft)}
  #teia .nd.pausado{opacity:.4}
  #teia .nd.sel circle.b{stroke-width:4}
  #teia .halo{fill:none;stroke:var(--acento);stroke-width:2;opacity:0}
  #teia .nd.gerando .halo{animation:halo 1.6s ease-out infinite}
  #teia .cn rect{fill:var(--panel);stroke:var(--muted);stroke-width:1.5}
  #teia .cn text{fill:var(--text);font-size:12px;text-anchor:middle;font-family:var(--sans)}
  #teia .cn.local rect{stroke:var(--acento)}
  #teia .cn.nuvem rect{stroke:var(--azul)}
  #teia .cn.claude rect{stroke:var(--ok);stroke-dasharray:5 3}
  #teia .cn.plan{opacity:.55}
  #teia .cn.usa rect{fill:var(--azul-soft);stroke-width:3}
  #teia .hub-l{fill:var(--head);font-family:var(--serif);font-size:14px;text-anchor:middle}
  @keyframes halo{0%{r:16;opacity:.9}100%{r:34;opacity:0}}
  @media (prefers-reduced-motion: reduce){#teia .nd.gerando .halo{animation:none;opacity:.6}}


  .est3{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:14px;margin-bottom:14px}
  .drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:18px 12px;text-align:center;color:var(--muted);cursor:pointer;font-size:13.5px}
  .drop:hover,.drop.on{border-color:var(--acento);background:var(--acento-soft);color:var(--text)}
  .drop input{display:none}
  .mlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;font-size:13px}
  .mlist button{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;display:flex;justify-content:space-between;gap:8px}
  .mlist button[aria-current="true"]{border-color:var(--acento);background:var(--acento-soft)}
  .frame{position:relative;width:min(100%,var(--fw));aspect-ratio:var(--ar);margin:0 auto;background:#000;border-radius:10px;overflow:hidden}
  .frame .mid,.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .frame .vazioM{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:#cfd6ea;font-size:13px;background:#101C3D}
  .frame .ovm{position:absolute;bottom:4%;right:4%;pointer-events:none}
  .frame .ovs{position:absolute;left:6%;right:6%;bottom:22%;text-align:center;color:#fff;background:rgba(0,0,0,.6);border-radius:6px;padding:4px 8px;font-size:12px;pointer-events:none}
  .frame .zb{position:absolute;left:0;right:0;bottom:0;height:20%;background:rgba(220,60,60,.28);color:#fff;font-size:10.5px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;pointer-events:none}
  .frame .zd{position:absolute;right:0;top:35%;bottom:20%;width:13%;background:rgba(220,60,60,.28);pointer-events:none}
  .seg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
  .seg button{background:transparent;border:1px solid var(--line);border-radius:9px;padding:4px 11px;font-size:13px}
  .seg button[aria-pressed="true"]{background:var(--acento);color:var(--on-acento);border-color:var(--acento);font-weight:600}
  .ctl{margin-bottom:12px;font-size:13.5px}
  .ctl label{display:block;color:var(--muted);font-size:12.5px;margin-bottom:3px}
  .ctl input[type=range],.ctl select,.ctl input[type=text],.ctl input[type=number],.ctl textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
  .ctl textarea{min-height:70px;resize:vertical}
  .fix{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px solid var(--line)}
  .fix b{color:var(--ok);font-weight:600}
  .barra{height:10px;border-radius:6px;background:var(--panel-2);overflow:hidden;margin-top:6px}
  .barra span{display:block;height:10px;background:var(--acento);width:0}
  .ck{display:grid;gap:6px;font-size:13.5px;margin:0;padding:0;list-style:none}
  .ck li{display:flex;justify-content:space-between;gap:8px}

  .frame .bgb{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(22px) brightness(.75)}
  .frame .zt{position:absolute;left:0;right:0;top:0;background:rgba(220,60,60,.28);pointer-events:none}
  .ck .ok{color:var(--ok)} .ck .av{color:var(--aviso)} .ck .bl{color:var(--perigo)}
  p.bad{color:var(--perigo);font-size:12.5px;margin-top:8px} p.warn{color:var(--aviso);font-size:12.5px;margin-top:8px}
  .seg.col button{flex:1 1 100%;text-align:left}

  .mus2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
  .mlist .bad{color:var(--perigo);font-size:12px}
  .ctl input[type=checkbox]{width:auto;margin-right:6px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .ctl input:disabled{opacity:.5}

  @media (max-width:980px){
    .teiaC{grid-template-columns:1fr}
    .tres,.semaf,.split,.est3,.mus2{grid-template-columns:1fr}
    .kb{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:760px){
    .app{grid-template-columns:1fr;grid-template-rows:auto auto auto minmax(0,1fr)}
    .side{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:6px}
    .nav{width:auto;white-space:nowrap}
    .nav .em{display:none}
    .main{padding:14px}
    .kb{grid-template-columns:1fr}
    .proj small{display:none}
    .top .chip{display:none}
    #teia svg{min-width:680px}
  }

  /* ---- camada real ---- */
  .chip[data-ok="false"] i{background:var(--perigo)}
  .cvw{display:grid;grid-template-columns:250px 1fr;gap:12px;height:calc(100vh - 190px);min-height:440px}
  .cvh{display:flex;flex-direction:column;gap:8px;overflow:hidden}
  .cvh input,.cvin textarea{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit}
  #cvLista{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
  #cvLista .gr{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px}
  #cvLista button{width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:8px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  #cvLista button:hover,#cvLista button[aria-current]{background:var(--acento-soft)}
  .cvm{display:flex;flex-direction:column;min-width:0}
  .cvcol{flex:1;overflow:auto;padding:4px 2px}
  .cvmsg{display:flex;gap:10px;margin:0 0 12px}
  .cvmsg.u{justify-content:flex-end}
  .cvmsg img{width:30px;height:30px;border-radius:8px;flex:none}
  .cvmsg .tx{max-width:780px;padding:9px 13px;border-radius:12px;background:var(--panel-2);line-height:1.55;min-width:0}
  .cvmsg.a .tx{background:transparent;border:1px solid var(--line)}
  .cvmsg.e .tx{border-color:var(--perigo);color:var(--perigo)}
  .cvmsg .tx p{margin:0 0 8px}.cvmsg .tx ul,.cvmsg .tx ol{margin:0 0 8px;padding-left:20px}
  .cvmsg .tx code{background:var(--panel-2);padding:0 4px;border-radius:4px;font-size:.92em}
  .codigo{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0}
  .cod-topo{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:var(--panel-2);font-size:12px;color:var(--muted)}
  .codigo pre{margin:0;padding:10px;overflow:auto;font-size:13px}.codigo code{background:none;padding:0}
  .cvin{display:flex;gap:8px;margin-top:8px}.cvin textarea{flex:1;resize:none;max-height:160px}
  .cvini{text-align:center;padding:30px 10px}.cvini img{width:72px;height:72px;border-radius:16px}
  .cvini .lema{font-family:var(--serif);font-size:22px;color:var(--head);margin:10px 0 2px}
  .cvcart{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:16px}
  .cvcart .btn{text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 12px}.cvcart .btn span{color:var(--muted);font-size:12.5px}
  .cvvoz{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:6px;font-size:13px}.cvvoz label{display:flex;gap:6px;align-items:center;cursor:pointer}

  function desenharTeia() {

    const P = { hub: { x: CX, y: CY } }; G.nos.forEach((n) => (P[n[0]] = pos(n[1], n[2])));
    let arestas = ""; G.nos.forEach((n) => { const a = P[n[3]], b = P[n[0]]; arestas += '<line class="ed' + (n[4] ? " sv" : "") + '" data-e="' + n[0] + '" x1="' + a.x.toFixed(1) + '" y1="' + a.y.toFixed(1) + '" x2="' + b.x.toFixed(1) + '" y2="' + b.y.toFixed(1) + '"/>'; });

  function ctxAudio() { if (!AU.ctx) AU.ctx = new (window.AudioContext || window.webkitAudioContext)(); return AU.ctx; }
  function gerarFaixa(freqs, amp, dur) {
    const c = ctxAudio(), sr = c.sampleRate, n = Math.floor(sr * dur), b = c.createBuffer(2, n, sr);
    for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch);
      for (let i = 0; i < n; i++) { const tt = i / sr; let v = 0; freqs.forEach((f, k) => { v += Math.sin(2 * Math.PI * f * tt) / (k + 1); }); d[i] = amp * Math.min(1, tt / 0.4, (dur - tt) / 0.4) * v / freqs.length * 1.6; } }
    return b;
  }
  function rmsDb(buf) { const d = buf.getChannelData(0), passo = Math.max(1, Math.floor(d.length / 50000)); let s = 0, n = 0; for (let i = 0; i < d.length; i += passo) { s += d[i] * d[i]; n++; } return 20 * Math.log10(Math.sqrt(s / n) || 1e-6); }
  const musAtual = () => S.est.musicas.find((m) => m.id === S.est.mus) || null;
  function garantirBuffer(t) { if (t && !t.buffer && t.freqs) { t.buffer = gerarFaixa(t.freqs, t.amp, 6); t.rms = rmsDb(t.buffer); t.dur = 6; } return t; }
  function ganho(t) { const norm = Math.min(8, Math.max(0.1, Math.pow(10, (-20 - t.rms) / 20))); return norm * (S.est.vol / 100) * 0.5; }
  function pararAudio() { try { if (AU.src) AU.src.stop(); } catch (e) {} AU.src = null; const v = document.querySelector(".frame video"); if (v) v.pause(); S.est.tocando = false; const b = $("#bToca"); if (b) b.textContent = "Ouvir com a mídia"; }
  function tocar() {

    const c = ctxAudio(); c.resume(); pararAudio();
    AU.src = c.createBufferSource(); AU.src.buffer = t.buffer; AU.src.loop = true; AU.gain = c.createGain(); AU.gain.gain.value = ganho(t);

  function calc() {

  }

  function escC(t) {
    return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function cvEmLinha(t) {
    return t.split(/(`[^`\n]+`)/).map((p) => {
      if (p.length > 1 && p[0] === "`" && p[p.length - 1] === "`") {
        return "<code>" + p.slice(1, -1) + "</code>";
      }
      return p
        .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*\w])\*([^\s*](?:[^*\n]*[^\s*])?)\*(?!\*)/g, "$1<em>$2</em>")
        .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,
                 '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    }).join("");
  }

  function cvBlocos(texto) {
    const linhas = texto.split("\n");
    let html = "";
    let par = [];
    let lista = null; // { tipo: "ul" | "ol", itens: [] }

    const fechaPar = () => {
      if (par.length) { html += "<p>" + par.map(cvEmLinha).join("<br>") + "</p>"; par = []; }
    };
    const fechaLista = () => {
      if (lista) {
        html += "<" + lista.tipo + ">" + lista.itens.map((i) => "<li>" + cvEmLinha(i) + "</li>").join("") + "</" + lista.tipo + ">";
        lista = null;
      }
    };

    for (const bruta of linhas) {
      const l = bruta.replace(/\s+$/, "");
      let m;
      if (!l.trim()) { fechaPar(); fechaLista(); continue; }
      if ((m = l.match(/^\s*(#{1,4})\s+(.*)$/))) {
        fechaPar(); fechaLista();
        const tag = m[1].length <= 2 ? "h3" : "h4";
        html += "<" + tag + ">" + cvEmLinha(m[2]) + "</" + tag + ">";
      } else if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) {
        fechaPar(); fechaLista(); html += "<hr>";
      } else if ((m = l.match(/^\s*[-*•]\s+(.*)$/))) {
        fechaPar();
        if (!lista || lista.tipo !== "ul") { fechaLista(); lista = { tipo: "ul", itens: [] }; }
        lista.itens.push(m[1]);
      } else if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) {
        fechaPar();
        if (!lista || lista.tipo !== "ol") { fechaLista(); lista = { tipo: "ol", itens: [] }; }
        lista.itens.push(m[1]);
      } else if ((m = l.match(/^&gt;\s?(.*)$/))) {
        fechaPar(); fechaLista();
        html += "<blockquote>" + cvEmLinha(m[1]) + "</blockquote>";
      } else {
        fechaLista();
        par.push(l);
      }
    }
    fechaPar(); fechaLista();
    return html;
  }

  function cvFormatar(texto) {
    return String(texto).split("```").map((parte, i) => {
      if (i % 2 === 1) {
        const q = parte.indexOf("\n");
        const lang = q >= 0 ? parte.slice(0, q).trim() : "";
        const codigo = q >= 0 ? parte.slice(q + 1) : parte;
        return '<div class="codigo"><div class="cod-topo"><span>' + escC(lang || "código") +
               '</span><button class="ghost copiar" type="button">Copiar</button></div><pre><code>' +
               escC(codigo.replace(/\n$/, "")) + "</code></pre></div>";
      }
      return cvBlocos(escC(parte));
    }).join("");
  }



  function cvQuando(c) { return c.atualizada || (typeof c.id === "number" ? c.id : 0); }
  function cvGrupo(ms) {
    const h = new Date(); h.setHours(0, 0, 0, 0); const d = 86400000;
    return ms >= h.getTime() ? "Hoje" : ms >= h.getTime() - d ? "Ontem" : ms >= h.getTime() - 7 * d ? "Últimos 7 dias" : "Anteriores";
  }
  function cvHist() {
    const ul = $("#cvLista"); if (!ul) return;
    ul.innerHTML = "";
    const termo = cv.filtro.trim().toLowerCase();
    const itens = cv.lista.filter((c) => !termo || c.title.toLowerCase().includes(termo)).sort((a, b) => cvQuando(b) - cvQuando(a));
    $("#cvVazio").textContent = itens.length ? "" : (termo ? "Nenhuma conversa encontrada." : "Suas conversas aparecem aqui.");
    let ult = "";
    itens.forEach((c) => {
      const g = cvGrupo(cvQuando(c));
      if (g !== ult) { const h = document.createElement("li"); h.className = "gr"; h.textContent = g; ul.appendChild(h); ult = g; }
      const li = document.createElement("li"), b = document.createElement("button");
      b.type = "button"; b.textContent = c.title; b.title = c.title;
      if (cv.atual && cv.atual.id === c.id) b.setAttribute("aria-current", "true");
      b.onclick = () => cvAbrir(c);
      li.appendChild(b); ul.appendChild(li);
    });
  }
  function cvMsgs() {
    const col = $("#cvCol"); if (!col) return;
    col.innerHTML = "";
    const msgs = cv.atual ? cv.atual.messages : [];
    if (!msgs.length) {
      col.innerHTML = '<div class="cvini"><img src="' + LOGO.turbo + '" alt="Adonai Turbo"><p class="lema">O que vamos construir hoje?</p><p class="mut">Escolha um ponto de partida ou escreva do seu jeito.</p><div class="cvcart"></div></div>';
      const g = col.querySelector(".cvcart");
      CARTOES.forEach((c) => { const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.innerHTML = "<strong></strong><span></span>"; b.querySelector("strong").textContent = c.t; b.querySelector("span").textContent = c.d; b.onclick = () => cvEnviar(c.q); g.appendChild(b); });
      return;
    }
    msgs.forEach((m, i) => {
      const d = document.createElement("div");
      d.className = "cvmsg " + (m.role === "user" ? "u" : "a") + (m.erro ? " e" : "");
      d.innerHTML = m.role === "user" ? '<div class="tx">' + cvFormatar(m.content) + "</div>"
        : '<img src="' + LOGO.turbo + '" alt=""><div class="tx">' + cvFormatar(m.content) + (m.erro ? "" : '<div><button class="btn sm copiar-msg" type="button" data-i="' + i + '">Copiar resposta</button></div>') + "</div>";
      col.appendChild(d);
    });
    if (cv.ocupado) { const p = document.createElement("div"); p.className = "cvmsg a"; p.innerHTML = '<img src="' + LOGO.turbo + '" alt=""><div class="tx mut">O assistente está pensando…</div>'; col.appendChild(p); }
  }
  function cvRender() {
    const t = $("#cvTit"); if (!t) return;
    t.textContent = cv.atual ? cv.atual.title : "Nova conversa";
    cvHist(); cvMsgs();
    const col = $("#cvCol"); col.scrollTop = cv.atual && cv.atual.messages.length ? col.scrollHeight : 0;
    const b = $("#cvEnv"); if (b) b.disabled = cv.ocupado;
  }
  function cvAltura() { const t = $("#cvIn"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }

  /* ---------- Voz: gravar (transcrição local no servidor) e falar a resposta (voz do Windows) ---------- */
  const VZ = { auto: true, voz: true };
  try { const s = JSON.parse(localStorage.getItem("adonai.voz") || "null"); if (s) { VZ.auto = s.auto !== false; VZ.voz = s.voz !== false; } } catch (e) {}
  const vzSalvar = () => { try { localStorage.setItem("adonai.voz", JSON.stringify({ auto: VZ.auto, voz: VZ.voz })); } catch (e) {} };
  const MIC = { rec: null, partes: [], stream: null, t0: 0, tm: null, estado: "parado" };
  const micMsg = (m) => { const e = $("#cvMicEst"); if (e) e.textContent = m || ""; };
  function micBotao() { const b = $("#cvMic"); if (!b) return; b.textContent = MIC.estado === "gravando" ? "⏹ Parar" : MIC.estado === "transcrevendo" ? "… Transcrevendo" : "🎤 Falar"; b.disabled = MIC.estado === "transcrevendo"; b.classList.toggle("pri", MIC.estado === "gravando"); }
  async function micAlternar() {
    if (MIC.estado === "gravando") return micParar();
    if (MIC.estado !== "parado") return;
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || typeof MediaRecorder === "undefined") { micMsg("Este navegador não permite gravar. Abra a tela em http://localhost:3000/tela no Brave."); return; }
    try { MIC.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
    catch (e) { micMsg("O microfone foi bloqueado. Clique no cadeado ao lado do endereço e permita o microfone."); return; }
    pararVoz();
    const tipo = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"].find((x) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(x)) || "";
    MIC.partes = []; MIC.rec = tipo ? new MediaRecorder(MIC.stream, { mimeType: tipo }) : new MediaRecorder(MIC.stream);
    MIC.rec.ondataavailable = (e) => { if (e.data && e.data.size) MIC.partes.push(e.data); };
    MIC.rec.onstop = micEnviar; MIC.rec.start(); MIC.estado = "gravando"; MIC.t0 = Date.now(); micBotao();
    MIC.tm = setInterval(() => { const s = Math.round((Date.now() - MIC.t0) / 1000); micMsg("Gravando… " + s + " s (clique em Parar quando terminar)"); if (s >= 60) micParar(); }, 400);
  }
  function micParar() { if (MIC.estado !== "gravando") return; clearInterval(MIC.tm); MIC.estado = "transcrevendo"; micBotao(); micMsg("Transcrevendo no seu computador…"); try { MIC.rec.stop(); } catch (e) {} if (MIC.stream) MIC.stream.getTracks().forEach((x) => x.stop()); }
  async function micEnviar() {
    const blob = new Blob(MIC.partes, { type: (MIC.rec && MIC.rec.mimeType) || "audio/webm" });
    try {
      const r = await fetch(API + "/api/voz/transcrever", { method: "POST", headers: { "Content-Type": blob.type || "audio/webm" }, body: blob, signal: AbortSignal.timeout(180000) });
      const d = await r.json().catch(() => null);
      if (!r.ok) throw new Error(d && d.erro ? d.erro : r.status === 404 ? "O servidor ainda não tem a voz. Rode Instalar_Voz.bat e reinicie o servidor." : "Erro " + r.status);
      const texto = (d.texto || "").trim();
      if (!texto) { micMsg("Não entendi nada. Fale mais perto do microfone e tente de novo."); }
      else { const c = $("#cvIn"); if (c) { c.value = texto; cvAltura(); } micMsg("Entendi (" + d.segundos + " s): " + texto.slice(0, 80)); if (VZ.auto) cvEnviar(texto); }
    } catch (e) { micMsg("Não consegui: " + e.message); }
    MIC.estado = "parado"; micBotao();
  }
  const vozPT = () => { const l = (window.speechSynthesis && speechSynthesis.getVoices()) || []; const pt = l.filter((v) => /pt[-_]BR/i.test(v.lang)); const masculino = /(antonio|antônio|daniel|joao|joão|ricardo|felipe|bruno|carlos|male|homem)/i; const natural = /(natural|online|neural)/i; return pt.find((v) => masculino.test(v.name) && natural.test(v.name)) || pt.find((v) => masculino.test(v.name)) || pt.find((v) => natural.test(v.name)) || pt[0] || l.find((v) => /^pt/i.test(v.lang)) || null; };
  function pararVoz() { try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {} }
  function textoFalado(md) { return String(md).replace(/```[\s\S]*?```/g, " (trecho de código omitido) ").replace(/`([^`]+)`/g, "$1").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/https?:\/\/\S+/g, " link ").replace(/[*_#>|]+/g, " ").replace(/\s+/g, " ").trim(); }
  function falar(md) {
    if (!window.speechSynthesis) return; pararVoz();
    let txt = textoFalado(md); if (txt.length > 1400) txt = txt.slice(0, 1400) + ". Resposta longa: leia o resto na tela.";
    const partes = []; (txt.match(/[^.!?\n]+[.!?]?/g) || [txt]).forEach((s) => { s = s.trim(); if (!s) return; const u = partes[partes.length - 1]; if (u && (u + " " + s).length < 200) partes[partes.length - 1] = u + " " + s; else partes.push(s); });
    const v = vozPT(); partes.forEach((p) => { const u = new SpeechSynthesisUtterance(p); u.lang = "pt-BR"; if (v) u.voice = v; u.rate = 0.92; u.pitch = 0.78; u.volume = 1; speechSynthesis.speak(u); });
  }
  try { if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {}; } catch (e) {}

  async function cvEnviar(texto) {
    texto = (texto || "").trim(); if (!texto || cv.ocupado) return;
    if (!cv.atual) { cv.atual = { id: Date.now(), title: "Nova conversa", messages: [], nuvem: false, atualizada: Date.now() }; cv.lista.unshift(cv.atual); }
    if (!cv.atual.messages.length) cv.atual.title = texto.length > 40 ? texto.slice(0, 40) + "…" : texto;
    cv.atual.messages.push({ role: "user", content: texto });
    cv.atual.atualizada = Date.now();
    const campo = $("#cvIn"); if (campo) { campo.value = ""; cvAltura(); }
    cv.ocupado = true; cvRender();
    const alvo = cv.atual, ctrl = new AbortController(), lim = setTimeout(() => ctrl.abort(), 300000);
    try {
      const r = await fetch(API + "/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensagem: texto, conversaId: alvo.nuvem ? alvo.id : null, mensagens: alvo.messages.filter((m) => !m.erro).map((m) => ({ role: m.role, content: m.content })) }), signal: ctrl.signal });
      const d = await r.json().catch(() => ({}));
      if (d.conversaId && !alvo.nuvem) { alvo.id = d.conversaId; alvo.nuvem = true; alvo.carregada = true; }
      if (!r.ok) throw new Error(d.erro || "O servidor respondeu com erro " + r.status + ".");
      alvo.messages.push({ role: "assistant", content: d.resposta || "(resposta vazia)" }); if (VZ.voz && d.resposta) falar(d.resposta);
    } catch (e) {
      const aviso = e.name === "AbortError" ? "O servidor levou mais de 5 minutos para responder. Tente uma pergunta mais curta."
        : e instanceof TypeError ? "Não consegui falar com o backend em localhost:3000. Confira se a janela do CMD com “node server.js” está aberta." : e.message;
      alvo.messages.push({ role: "assistant", content: aviso, erro: true });
    } finally {
      clearTimeout(lim); alvo.atualizada = Date.now(); cv.ocupado = false; cvSalvar(); cvRender();
      const c2 = $("#cvIn"); if (c2) c2.focus();
    }
  }
  async function cvCarregarLista() {
    try {
      const r = await fetch(API + "/api/conversas"); if (!r.ok) throw new Error("sem Supabase");
      const d = await r.json();
      cv.lista = (d.conversas || []).map((c) => ({ id: c.id, title: c.titulo, messages: [], nuvem: true, carregada: false, atualizada: new Date(c.atualizada_em).getTime() }));
      cv.atual = null;
    } catch (e) { /* sem Supabase: continua com as conversas guardadas neste navegador */ }
    cvRender();
  }
  async function cvAbrir(c) {
    cv.atual = c; cvRender();
    if (c.nuvem && !c.carregada) {
      try {
        const r = await fetch(API + "/api/conversas/" + c.id); const d = await r.json(); if (!r.ok) throw new Error("erro");
        c.messages = (d.mensagens || []).map((m) => ({ role: m.papel, content: m.conteudo })); c.carregada = true;
      } catch (e) { c.messages = [{ role: "assistant", content: "Não consegui carregar esta conversa agora. Tente abrir de novo.", erro: true }]; }
      if (cv.atual === c) cvRender();
    }
  }
  function cvCopiar(botao, texto, rotulo) {
    navigator.clipboard.writeText(texto).then(() => { botao.textContent = "Copiado"; }).catch(() => { botao.textContent = "Não foi possível copiar"; }).finally(() => setTimeout(() => { botao.textContent = rotulo; }, 1600));
  }
  function cvClique(e) {
    const c = e.target.closest(".copiar");
    if (c) { cvCopiar(c, c.closest(".codigo").querySelector("code").textContent, "Copiar"); return; }
    const m = e.target.closest(".copiar-msg");
    if (m && cv.atual) { const msg = cv.atual.messages[Number(m.dataset.i)]; if (msg) cvCopiar(m, msg.content, "Copiar resposta"); }
  }
  VIEWS.conversas = function () {
    return '<div class="cab"><h1>Conversas</h1><p>O chat do Adonai Turbo, com o modelo configurado no servidor. As conversas ficam salvas no Supabase.</p></div>' +
      '<div class="cvw"><aside class="card cvh"><button class="btn pri" id="cvNova" type="button">Nova conversa</button><input id="cvBusca" placeholder="Buscar conversas" aria-label="Buscar conversas"><ul id="cvLista"></ul><p class="mut" id="cvVazio"></p></aside>' +
      '<section class="card cvm"><h2 id="cvTit">Nova conversa</h2><div id="cvCol" class="cvcol"></div><div class="cvin"><textarea id="cvIn" rows="1" placeholder="Escreva ou clique em Falar…" aria-label="Mensagem"></textarea><button class="btn" id="cvMic" type="button" title="Gravar sua voz (clique de novo para parar)">🎤 Falar</button><button class="btn pri" id="cvEnv" type="button">Enviar</button></div><div class="cvvoz"><span id="cvMicEst" class="mut"></span><label><input type="checkbox" id="cvAuto"> Enviar sozinho depois de falar</label><label><input type="checkbox" id="cvVoz"> Responder em voz</label><button class="btn sm" id="cvTesta" type="button">Testar voz</button><button class="btn sm" id="cvPara" type="button">Parar voz</button></div></section></div>';
  };
  function cvIniciar() {
    const t = $("#cvIn"); if (!t) return;
    $("#cvEnv").onclick = () => cvEnviar(t.value);
    $("#cvMic").onclick = micAlternar; micBotao();
    const ca = $("#cvAuto"), cv2 = $("#cvVoz"); if (ca) { ca.checked = VZ.auto; ca.onchange = () => { VZ.auto = ca.checked; vzSalvar(); }; } if (cv2) { cv2.checked = VZ.voz; cv2.onchange = () => { VZ.voz = cv2.checked; vzSalvar(); if (!VZ.voz) pararVoz(); }; }
    $("#cvTesta").onclick = () => { if (!window.speechSynthesis) { micMsg("Este navegador não tem voz."); return; } const v = vozPT(); micMsg(v ? "Voz: " + v.name : "Não achei voz em português; usando a padrão."); falar("Olá! Eu sou o assistente do Adonai Turbo. Estou falando em português do Brasil."); };
    $("#cvPara").onclick = pararVoz;
    t.oninput = cvAltura;
    t.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); cvEnviar(t.value); } };
    $("#cvNova").onclick = () => { cv.atual = null; cvRender(); t.focus(); };
    $("#cvBusca").oninput = (e) => { cv.filtro = e.target.value; cvHist(); };
    $("#cvCol").onclick = cvClique;
    cvRender();
  }

  /* ---------- Navegação e início ---------- */
  const _navegar = navegar;
  navegar = function (v) { _navegar(v); chips(); aviso(); if (v === "estudio" && S.proj === "market") e2Iniciar(); if (v === "conversas") cvIniciar(); };
  document.addEventListener("change", (e) => { const t = e.target; if (t && t.dataset && t.dataset.rSel) RL.sel[t.dataset.rSel] = t.value; });
  const _patch = patch;
  patch = function () { const a = document.activeElement; if (S.view === "tarefas" && a && (a.tagName === "SELECT" || a.id === "novaT" || a.id === "novaD")) return; _patch(); };
  window.rSync = sync;
  setInterval(sync, 8000);
  setInterval(saude, 20000);
  cvCarregarLista();
  sync(); saude();

  montar();
  navegar("central");
</script>
</body>
</html>
