name: Adonai Trade documentation and schema gates

on:
  pull_request:
    branches: [main]
    paths:
      - "adonai-trade/docs/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "tests/test_excellence_backlog.py"
      - ".github/workflows/adonai-trade-quality.yml"
  push:
    branches: [docs/adonai-trade-excellence-20261017]
    paths:
      - "adonai-trade/docs/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "tests/test_excellence_backlog.py"
      - ".github/workflows/adonai-trade-quality.yml"

permissions:
  contents: read

concurrency:
  group: adonai-trade-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate JSON and backlog consistency
        run: python -m unittest discover -s tests -p "test_excellence_backlog.py" -v
