name: RH Adonai static validation

on:
  pull_request:
    paths:
      - "public/Adonai_Turbo_Real.html"
      - "tests/rh-adonai.test.cjs"
      - ".github/workflows/rh-adonai.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rh-adonai-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate RH Adonai interface contract
        run: node tests/rh-adonai.test.cjs
